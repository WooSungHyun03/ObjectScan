[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "objectscan-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "numpy>=2,<3", "Pillow>=11,<13", "psutil>=6,<8"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.17,<0.18"]
bake = ["trimesh>=4.6,<5", "xatlas>=0.0.10"]
[project.scripts]
objectscan-worker = "objectscan_worker.main:main"
[tool.setuptools.packages.find]
include = ["objectscan_worker*"]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
