name: Independent platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes npm@11 ci
      - run: npm run db:start > /tmp/supabase-start.log 2>&1
      - run: npx supabase migration up --local
      - name: Configure isolated test services without printing credentials
        run: |
          npx supabase status -o json > /tmp/objectscan-status.json
          node scripts/configure-local.mjs /tmp/objectscan-status.json
      - run: npx prettier --check apps packages scripts tests
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: test-results/
      - run: npx supabase stop
        if: always()
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e './gpu-worker[test,bake]'
      - run: python -m pytest gpu-worker/tests
# Real CUDA model smoke is a separate hardware release gate, never simulated in CI.
